[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qq-chat-export"
version = "1.0.0"
description = "Export and analyze QQ MsgBackup chat databases."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "frida>=16.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
qq-chat-export = "qq_backup_export.cli:main"

[tool.setuptools.packages.find]
include = ["qq_backup_export*"]

